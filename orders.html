<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11130f">
  <title>My Orders | Three Coast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="orders.css">
</head>
<body>
  <header class="orders-header">
    <a class="brand-lockup" href="index.html">
      <img src="images/logo.jpg" alt="">
      <span>Three Coast</span>
    </a>
    <a class="back-link" href="index.html">Back to shop</a>
  </header>
  <main class="orders-main">
    <p class="eyebrow">Three Coast account</p>
    <h1>My orders</h1>
    <p class="intro">Check your order status, delivery address, and items.</p>
    <p class="page-status" id="page-status" role="status" aria-live="polite"></p>

    <section class="orders-login" id="orders-login" hidden>
      <h2>Sign in to continue.</h2>
      <form id="orders-login-form">
        <label>Phone number<input name="phone" type="tel" autocomplete="tel" inputmode="tel" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
      </form>
      <p>New to Three Coast? <a href="index.html?account=register">Create an account</a> before placing an order.</p>
    </section>

    <section class="orders-content" id="orders-content" hidden>
      <div class="orders-toolbar">
        <p id="orders-greeting"></p>
        <div>
          <button id="orders-refresh" type="button">Refresh</button>
          <button id="orders-signout" type="button">Sign out</button>
        </div>
      </div>
      <div class="orders-list" id="orders-list"></div>
    </section>
  </main>
  <script src="orders.js"></script>
</body>
</html>
